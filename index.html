<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sellers' Performance Dashboard</title>
<style>
  :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#59636e; --accent:#f2c811; --border:#d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#151b23; --text:#e6edf3; --muted:#9198a1; --border:#30363d; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:40px 16px 56px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  .bar { width:56px; height:5px; background:var(--accent); border-radius:3px; margin:12px 0 16px; }
  p.lead { margin:0 0 24px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; }
  video { width:100%; display:block; border-radius:6px; background:#000; }
  .links { margin-top:24px; display:flex; flex-wrap:wrap; gap:10px; }
  .links a { text-decoration:none; color:var(--text); border:1px solid var(--border); background:var(--card); padding:8px 14px; border-radius:6px; font-weight:600; }
  .links a.primary { background:var(--accent); border-color:var(--accent); color:#1f2328; }
  footer { margin-top:32px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Sellers' Performance Dashboard</h1>
  <div class="bar"></div>
  <p class="lead">A Power BI dashboard for sales managers: products sold and revenue per rep, monthly trends, progress against target, and the top customers and products. Walkthrough, 1:26.</p>
  <div class="card">
    <video controls playsinline preload="metadata" poster="Sellers'%20Performance/images/dashboard.png">
      <source src="Sellers'%20Performance/dashboard_walkthrough.mp4" type="video/mp4">
    </video>
  </div>
  <div class="links">
    <a class="primary" href="https://github.com/andrescarton/Power-BI">Project on GitHub</a>
    <a href="Sellers'%20Performance/Dashboard.pbix">Download the .pbix</a>
    <a href="https://github.com/andrescarton/Power-BI/blob/main/Sellers'%20Performance/sales_analysis.ipynb">Notebook</a>
  </div>
  <footer>Andre Kim Scarton · Course project</footer>
</main>
</body>
</html>
